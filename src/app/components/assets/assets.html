<div class="container-fluid overflow-auto">
  <div class="d-flex flex-row">
    <div class="form-group">
      <select class="form-select" [value]="selectedCategoryId" (change)="search($event)">
          <option [ngValue]="0" selected disabled>เลือกหมวดหมู่</option>
          <option [ngValue]="1">หม้อแปลง</option>
          <option [ngValue]="2">ตู้ไฟฟ้า</option>
          <option [ngValue]="3">เครื่องกำเนิดไฟฟ้า</option>
          <option [ngValue]="4">ปั้มส่งน้ำ</option>
          <option [ngValue]="5">ปั้มเพิ่มแรงดัน</option>
          <option [ngValue]="6">ปั้มดับเพลิง</option>
          <option [ngValue]="7">ปั้มเติมอากาศ</option>
          <option [ngValue]="8">ปั้มจุ่ม</option>
          <option [ngValue]="9">กังหันตีน้ำ</option>
          <option [ngValue]="10">สปริงเกอร์</option>
          <option [ngValue]="11">สูบน้ำระบบเครื่องยนต์</option>
          <option [ngValue]="12">สูบน้ำระบบไฟฟ้า</option>
          <option [ngValue]="13">แจ้งเหตุเพลิงไหม้</option>
          <option [ngValue]="14">ดับเพลิงชะลอน้ำ</option>
      </select>
    </div>

    <button class="add-button ms-1" type="button" [routerLink]="['/admin/asset-form']">
      <span aria-hidden="true">+</span> เพิ่มข้อมูลเครื่องจักร
    </button>
  </div>

  @if (errorMessage) {
    <div class="alert alert-danger mt-3" role="alert">{{ errorMessage }}</div>
  }

  <div class="table-responsive mt-3">
      <table id="setting-user-table" class="table table-bordered mb-3">
          <caption></caption>

          <thead>
              <tr>
                  @for (header of dataTable.headerRow; track $index) {
                      <th>{{ header }}</th>
                  }
              </tr>
          </thead>

          <tbody>
              @for (row of dataTable.dataRows; track $index) {
                  <tr>
                      @for (cell of row; track $index) {
                          <td>{{ cell }}</td>
                      }
                  </tr>
              }
          </tbody>
      </table>
  </div>
</div>

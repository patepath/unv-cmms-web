<div class="management-backdrop" role="presentation" (click)="cancelled.emit()">
  <section
    class="management-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="asset-management-title"
    (click)="$event.stopPropagation()"
  >
  <!--
    <h2 id="asset-management-title" class="sr-only">
      {{ asset() ? 'Edit asset' : 'Add asset' }}
    </h2>
  -->
    <app-asset-form [asset]="asset()" (saved)="saved.emit($event)" (cancelled)="cancelled.emit()" />
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
  </section>
</div>


<div class="container-fluid overflow-auto">
    <form [formGroup]="categoryForm" (ngSubmit)="save()">
        <div class="d-flex flex-column">
            <div class="form-group mt-2" style="width: 40rem">
                <label for="categoryName">ชื่อประเภทอุปกรณ์</label>
                <input type="text" class="form-control" id="name" formControlName="name" placeholder="กรอกชื่อประเภทอุปกรณ์">
            </div>

            <div class="form-group mt-4">
                <button type="submit" class="btn btn-primary">บันทึก</button>
                <button type="button" class="btn btn-secondary ms-2" (click)="cancel()">ยกเลิก</button>
            </div>
        </div>
    </form>
</div>

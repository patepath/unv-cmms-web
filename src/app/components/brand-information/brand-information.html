<div class="container-fluid overflow-auto">
  <div class="d-flex flex-row">
    <button class="add-button ms-1" type="button" [routerLink]="['/admin/brand-form']">
      <span aria-hidden="true">+</span> เพิ่มยี่ห้อ    
    </button>
  </div>

  <div class="table-responsive mt-3">
    <table id="setting-brand-table" class="table table-bordered mb-3">
        <caption></caption>

        <thead>
            <tr>
                @for (header of dataTable.headerRow; track $index) {
                    <th>{{ header }}</th>
                }
            </tr>
        </thead>

        <tbody>
            @for (row of dataTable.dataRows; track $index) {
                <tr>
                    <td>{{ $index + 1 }}</td>
                    @for (cell of row; track $index) {
                        <td>{{ cell }}</td>
                    }
                </tr>
            }
        </tbody>
    </table>
</div>

<div class="container-fluid overflow-auto">
  <form [formGroup]="brandForm" (ngSubmit)="save()">
    <div class="d-flex flex-column">
      @if (errorMessage) {
        <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
      }
      <div class="form-group mt-2" style="width: 20rem">
        <label for="category">ประเภทอุปกรณ์</label>
        <select class="form-select" id="category" formControlName="category_id">
          <option [ngValue]="0" disabled>เลือกประเภทอุปกรณ์</option>
          @for (category of categories; track category.id) {
            <option [ngValue]="category.id">{{ category.name }}</option>
          }
        </select>
      </div>
      <div class="form-group mt-2" style="width: 40rem">
        <label for="brandName">ชื่อแบรนด์</label>
        <input
          type="text"
          class="form-control"
          id="name"
          formControlName="name"
          placeholder="กรอกชื่อแบรนด์"
        />
      </div>

      <div class="form-group mt-4">
        <button type="submit" class="btn btn-primary" [disabled]="isSaving">
          {{ isSaving ? 'กำลังบันทึก...' : 'บันทึก' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="cancel()">ยกเลิก</button>
      </div>
    </div>
  </form>
</div>
